
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Exclusão</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 50px auto;
        }
        h1 {
            color: #d9534f; /* Vermelho para indicar perigo */
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin: 0 10px;
        }
        .confirmar {
            background-color: #d9534f;
            color: white;
        }
        .cancelar {
            background-color: #5cb85c;
            color: white;
            text-decoration: none;
        }
        .cancelar:hover, .confirmar:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Confirmar Exclusão</h1>
        <p>Tem certeza que deseja excluir o aluno <strong>{{ aluno.nome_social|default:aluno.nome }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="confirmar">Excluir</button>
            <a href="{% url 'detalhes_aluno' aluno.id_aluno %}" class="cancelar">Cancelar</a>
        </form>
    </div>
</body>
<footer id="footer-acessibilidade" style="position: fixed; bottom: 0; left: 0; width: 100%; background: #0059B3; padding: 10px; z-index: 9999; border-top: 2px solid #007bff; display: flex; gap: 20px;">
    <button onclick="alterarFonte(2)" style="background: #444; color: white; border: 1px solid #666; border-radius: 5px; padding: 8px 15px; cursor: pointer; font-weight: bold; font-size: 18px;">A +</button>
    <button onclick="alterarFonte(-2)" style="background: #444; color: white; border: 1px solid #666; border-radius: 5px; padding: 8px 15px; cursor: pointer; font-weight: bold; font-size: 18px;">A -</button>
</footer>

<script>
    function alterarFonte(variacao) {
        // Altera o corpo da página
        const body = document.body;
        let estiloAtual = window.getComputedStyle(body).fontSize;
        let tamanhoNovo = parseFloat(estiloAtual) + variacao;

        if (tamanhoNovo >= 10 && tamanhoNovo <= 28) {
            body.style.fontSize = tamanhoNovo + "px";
            
            // Tenta aumentar botões e inputs também (para o orientador ver que tudo cresce)
            const elementos = document.querySelectorAll('button, input, .btn, select');
            elementos.forEach(el => {
                if (el.closest('#footer-acessibilidade')) return;
                let estiloEl = window.getComputedStyle(el).fontSize;
                el.style.fontSize = (parseFloat(estiloEl) + variacao) + "px";
            });
        }
    }
</script>
</html>
