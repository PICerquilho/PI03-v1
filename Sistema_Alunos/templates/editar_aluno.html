{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #E0F2F7;
            color: #333;
        }

        header {
            background-color: #0059B3;
        }

        .navbar-brand span {
            font-weight: 600;
            color: white;
        }

        .navbar-nav .nav-link {
            color: #FFFFFF !important;
            font-weight: 500;
        }

        .navbar-nav .nav-link:hover {
            color: #E0F2F7 !important;
        }

        .container {
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-top: 60px;
            margin-bottom: 60px;
        }

        h2 {
            color: #0044cc;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        label {
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #0059B3;
            outline: none;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        button, .btn-voltar {
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-primary {
            background-color: #0059B3;
            color: white;
        }

        .btn-primary:hover {
            background-color: #003399;
        }

        .btn-voltar {
            background-color: #777;
            color: white;
            text-decoration: none;
            text-align: center;
        }

        .btn-voltar:hover {
            background-color: #555;
        }

        .errorlist {
            color: red;
            font-size: 14px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho padronizado -->
    <header class="shadow-sm p-3 mb-4">
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#0059B3;">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center" href="{% url 'index' %}">
                    <img src="{% static 'imagens/brasao3.png' %}" alt="Brasão" width="40" class="me-2">
                    <span>Sistema Escolar</span>
                </a>
            </div>
        </nav>
    </header>

    <div class="container">
        <h2>Editar Aluno</h2>
        <form method="POST" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3" id="{% if field.name == 'deficiencia_qual' %}deficiencia_qual_div{% endif %}" {% if field.name == 'deficiencia_qual' %}style="display:none;"{% endif %}>
                    {{ field.label_tag }}
                    {{ field }}
                    {% if field.errors %}
                        <div class="errorlist">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <div class="buttons">
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                <a href="{% url 'detalhes_aluno' aluno.id_aluno %}" class="btn-voltar">Cancelar</a>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const deficienciaField = document.getElementById('id_deficiencia');
            const deficienciaQualDiv = document.getElementById('deficiencia_qual_div');

            function toggleDeficienciaQual() {
                if (deficienciaField && deficienciaQualDiv) {
                    deficienciaQualDiv.style.display = deficienciaField.value === 'S' ? 'block' : 'none';
                }
            }

            if (deficienciaField) {
                deficienciaField.addEventListener('change', toggleDeficienciaQual);
                toggleDeficienciaQual();
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
</body>
<footer id="footer-acessibilidade" style="position: fixed; bottom: 0; left: 0; width: 100%; background: #0059B3; padding: 10px; z-index: 9999; border-top: 2px solid #007bff; display: flex; gap: 20px;">
    <button onclick="alterarFonte(2)" style="background: #444; color: white; border: 1px solid #666; border-radius: 5px; padding: 8px 15px; cursor: pointer; font-weight: bold; font-size: 18px;">A +</button>
    <button onclick="alterarFonte(-2)" style="background: #444; color: white; border: 1px solid #666; border-radius: 5px; padding: 8px 15px; cursor: pointer; font-weight: bold; font-size: 18px;">A -</button>
</footer>

<script>
    function alterarFonte(variacao) {
        // Altera o corpo da página
        const body = document.body;
        let estiloAtual = window.getComputedStyle(body).fontSize;
        let tamanhoNovo = parseFloat(estiloAtual) + variacao;

        if (tamanhoNovo >= 10 && tamanhoNovo <= 28) {
            body.style.fontSize = tamanhoNovo + "px";
            
            // Tenta aumentar botões e inputs também (para o orientador ver que tudo cresce)
            const elementos = document.querySelectorAll('button, input, .btn, select');
            elementos.forEach(el => {
                if (el.closest('#footer-acessibilidade')) return;
                let estiloEl = window.getComputedStyle(el).fontSize;
                el.style.fontSize = (parseFloat(estiloEl) + variacao) + "px";
            });
        }
    }
</script>
</html>
